name: Terraform Azure

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      action:
        description: "apply albo destroy"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
#--
concurrency:
  group: terraform-azure-${{ github.ref }}
  cancel-in-progress: true
#--

permissions:
  id-token: write
  contents: read

env:
  CORTEX_API_KEY: ${{secrets.CORTEX_API_KEY}}
  CORTEX_API_KEY_ID: ${{secrets.CORTEX_API_KEY_ID}}
  CORTEX_API_URL: https://api-xsiam-clico.xdr.pl.paloaltonetworks.com
  
jobs:
  cortex-code-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Verify Node.js Version
      run: node -v

    - name: Download cortexcli
      run: |
        set -x
        crtx_resp=$(curl "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
          -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
          -H "Authorization: ${CORTEX_API_KEY}")
        crtx_url=$(echo $crtx_resp | jq -r ".signed_url")
        curl -o cortexcli $crtx_url
        chmod +x cortexcli
        ./cortexcli --version

    - name: Run Cortex CLI Code Scan
      run: |
        ./cortexcli \
          --api-base-url "${CORTEX_API_URL}" \
          --api-key "${CORTEX_API_KEY}" \
          --api-key-id "${CORTEX_API_KEY_ID}" \
          code scan \
          --directory "${{github.workspace}}" \
          --repo-id "${{github.repository}}" \
          --branch "${{github.ref_name}}" \
          --source "GITHUB_ACTIONS" \
          --repo-url "${{github.server_url}}/${{github.repository}}"

  terraform:
    needs: cortex-code-scan
    runs-on: ubuntu-latest
    environment: test-env

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
           fetch-depth: 0
#---
      - name: Set TF provenance vars (Code-to-Cloud)
        run: |
          echo "TF_VAR_git_repo=${GITHUB_REPOSITORY}" >> $GITHUB_ENV
          echo "TF_VAR_git_ref=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "TF_VAR_git_commit=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "TF_VAR_environment=test-env" >> $GITHUB_ENV

      - name: Add Yor tags to Terraform (auto, no commits)
        uses: bridgecrewio/yor-action@main
        with:
          directory: .
          commit_changes: "false"
#----

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: .

      - name: Terraform Format
        # żeby destroy nie blokował się na fmt, jeśli ktoś popsuje format
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Terraform Validate
        run: terraform validate
        working-directory: .

      - name: Terraform Plan (apply)
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'apply'
        run: terraform plan -out tfplan
        working-directory: .

      - name: Terraform Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan
        working-directory: .

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve
        working-directory: .
